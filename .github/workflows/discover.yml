name: 每周发现招聘来源

on:
  schedule:
    # UTC 1:00 = 北京时间周一 09:00（避开每日 08:00 采集）
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: discover-sources
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 探测候选来源
        run: python scripts/discover.py

      - name: 提交发现结果
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/discovery-sources.json data/discovery-report.json \
                  data/discovery-new.json reports/discovery.md
          if git diff --staged --quiet; then
            echo "发现结果无变化，跳过提交"
          else
            git commit -m "chore(discover): 每周招聘来源发现 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 新候选来源创建跟踪 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          p = "data/discovery-new.json"
          if not os.path.exists(p):
              raise SystemExit(0)
          try:
              items = json.load(open(p, encoding="utf-8"))
          except Exception:
              items = []
          print(f"新候选 {len(items)} 个")
          if not items:
              raise SystemExit(0)
          lines = ["本周发现以下待验证的招聘来源：", ""]
          for it in items:
              lines.append(f"- {it['name']}（{it['category']}）：{it['url']} 信号={it['signal']}")
          lines += ["", "请人工核对官方公开招聘渠道后，再决定是否新增采集器；验证通过前不会写入岗位数据。"]
          open("/tmp/issue-body.txt", "w", encoding="utf-8").write("\n".join(lines))
          PY
          if [ -s /tmp/issue-body.txt ]; then
            gh label create "discovery" --color "0E8A16" --description "招聘来源发现" 2>/dev/null || true
            gh issue create \
              --title "招聘来源发现 $(TZ=Asia/Shanghai date '+%Y-%m-%d')" \
              --body-file /tmp/issue-body.txt \
              --label "discovery" || true
          fi

      - name: 失败通知（自动创建 Issue）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="来源发现任务失败 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          BODY="运行编号：${{ github.run_id }}
          详情：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          说明：本周来源探测任务异常，请查看运行日志。"
          gh issue create --title "$TITLE" --body "$BODY" --label "discovery" 2>/dev/null || true
