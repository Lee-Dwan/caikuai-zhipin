name: 每日采集招聘数据

on:
  schedule:
    # GitHub Actions 使用 UTC；0 0 * * * = 北京时间每天 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:      # 支持在 Actions 页面手动触发

# 同一时间只跑一个采集任务，避免并发写数据
concurrency:
  group: collect-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行采集
        run: python scripts/collect.py

      - name: 采集结果摘要
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md; fi
          echo "### 采集结果" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' reports/latest.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "未生成报告" >> "$GITHUB_STEP_SUMMARY"

      - name: 采集健康检查（异常即告警失败）
        if: always()
        run: |
          python - <<'PY'
          import json, sys, os
          p = "data/collect-report.json"
          if not os.path.exists(p):
              print("::error::未生成采集报告，任务中断"); sys.exit(1)
          r = json.load(open(p, encoding="utf-8"))
          print(f"采集成功率：{r['succeeded']}/{r['attempted']}（{r['success_rate']}%）")
          if r["succeeded"] == 0:
              print("::error::全部数据源采集失败，已保留历史上一次数据，请检查网络或接口变更"); sys.exit(1)
          if r["success_rate"] < 60:
              print(f"::error::采集成功率仅 {r['success_rate']}%，低于 60% 告警阈值，请查看报告"); sys.exit(1)
          print("采集健康检查通过")
          PY

      - name: 提交数据更新
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/jobs.json data/meta.json data/firms.json \
                  data/state.json data/collect-report.json \
                  assets/js/data-fallback.js reports/latest.md
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新招聘数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi
