name: 每日采集招聘数据

on:
  schedule:
    # GitHub Actions 使用 UTC；0 0 * * * = 北京时间每天 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:      # 支持在 Actions 页面手动触发

# 同一时间只跑一个采集任务，避免并发写数据
concurrency:
  group: collect-jobs
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行采集
        run: python scripts/collect.py

      - name: 执行实习采集
        run: python scripts/collect_intern.py

      - name: 采集结果摘要
        if: always()
        run: |
          if [ -f reports/latest.md ]; then cat reports/latest.md; fi
          echo "### 采集结果" >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' reports/latest.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "未生成报告" >> "$GITHUB_STEP_SUMMARY"

      - name: 采集健康检查（异常即告警失败）
        if: always()
        run: |
          python - <<'PY'
          import json, sys, os
          p = "data/collect-report.json"
          if not os.path.exists(p):
              print("::error::未生成采集报告，任务中断"); sys.exit(1)
          r = json.load(open(p, encoding="utf-8"))
          print(f"社招采集成功率：{r['succeeded']}/{r['attempted']}（{r['success_rate']}%）")
          if r["succeeded"] == 0:
              print("::error::全部数据源采集失败，已保留历史上一次数据，请检查网络或接口变更"); sys.exit(1)
          if r["success_rate"] < 60:
              print(f"::error::采集成功率仅 {r['success_rate']}%，低于 60% 告警阈值，请查看报告"); sys.exit(1)
          p2 = "data/intern/collect-report.json"
          if os.path.exists(p2):
              r2 = json.load(open(p2, encoding="utf-8"))
              print(f"实习采集成功率：{r2['succeeded']}/{r2['attempted']}（{r2['success_rate']}%）")
              if r2["succeeded"] == 0:
                  print("::error::全部实习数据源采集失败，已保留历史数据，请检查"); sys.exit(1)
              if r2["success_rate"] < 60:
                  print(f"::error::实习采集成功率仅 {r2['success_rate']}%，低于 60% 告警阈值"); sys.exit(1)
          print("采集健康检查通过")
          PY

      - name: 提交数据更新
        run: |
          git config user.name  "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add data/jobs.json data/meta.json data/firms.json \
                  data/state.json data/collect-report.json \
                  data/intern/jobs.json data/intern/meta.json data/intern/firms.json \
                  data/intern/state.json data/intern/collect-report.json \
                  assets/js/data-fallback.js assets/js/data-fallback-intern.js reports/latest.md
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 自动更新招聘数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 通知搜索引擎收录（IndexNow）
        if: always()
        run: |
          curl -sS --max-time 20 "https://api.indexnow.org/indexnow?url=https%3A%2F%2FLee-Dwan.github.io%2Fcaikuai-zhipin%2F&key=71214d107d773df6375676d4d3f0777f" >/dev/null 2>&1 || true
          curl -sS --max-time 20 "https://api.indexnow.org/indexnow?url=https%3A%2F%2FLee-Dwan.github.io%2Fcaikuai-zhipin%2Fintern.html&key=71214d107d773df6375676d4d3f0777f" >/dev/null 2>&1 || true

      - name: 失败通知（自动创建 Issue）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="采集任务失败 $(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          BODY="运行编号：${{ github.run_id }}
          详情：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          说明：本次采集异常，线上仍展示上一次成功数据（历史数据未被覆盖）。请查看运行日志中的 ::error:: 提示。"
          gh label create "collect-failure" --color "D73A4A" --description "采集失败告警" 2>/dev/null || true
          gh issue create --title "$TITLE" --body "$BODY" --label "collect-failure" 2>/dev/null || \
          gh issue create --title "$TITLE" --body "$BODY" || true
